# Stagepool – Sperr-Regeln für das Synology-Webportal (nginx)
# Kopieren nach: /usr/local/etc/nginx/conf.d/<Portal-ID>/user.conf.stagepool
# (siehe docs/SYNOLOGY.md, Abschnitt 7). Enthält nur location-Blöcke, da die
# Datei innerhalb des server-Blocks des Webportals eingebunden wird.
# Präfix-Regeln mit ^~ greifen unabhängig von der Reihenfolge der übrigen
# Regeln (auch vor der PHP-Regel des Portals).
# Liegt Stagepool in einem Unterordner des Portals (z. B. /stagepool/),
# den Pfad davorsetzen: location ^~ /stagepool/inc/ { … }

location ^~ /inc/     { deny all; return 404; }
location ^~ /config/  { deny all; return 404; }
location ^~ /storage/ { deny all; return 404; }
location ^~ /docs/    { deny all; return 404; }
location ^~ /dist/    { deny all; return 404; }
location ~ /\.(?!well-known) { deny all; return 404; }

# Uploads: Bilder ausliefern, niemals Skripte ausführen
location ^~ /uploads/ {
    location ~* \.(php\d?|phtml|phar|pl|py|cgi)$ { deny all; return 404; }
    try_files $uri =404;
}
